<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
font-family:Arial;
}

.sidebar{
width:240px;
height:100vh;
background:#8b6f47;
color:white;
position:fixed;
padding:20px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
margin:15px 0;
cursor:pointer;
}

.main{
margin-left:260px;
padding:20px;
}

.card-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>


<div class="sidebar">

<h4>Admin</h4>

<a onclick="showDashboard()">Dashboard</a>
<a onclick="showOrders()">Orders</a>
<a onclick="showProducts()">Products</a>
<a onclick="showAdd()">Add Product</a>

<button
class="btn btn-light mt-3"
onclick="logout()">

Logout

</button>

</div>



<div class="main">

<div id="content"></div>

</div>



<script>

const API = "http://localhost:8080"
const token = localStorage.getItem("token")

if(!token) location.href="login.html"


// role check
fetch(API+"/me/profile",{
headers:{Authorization:"Bearer "+token}
})
.then(r=>r.json())
.then(d=>{
if(d.User.role!=="admin"){
alert("Admin only")
location.href="index.html"
}
showDashboard()
})



/* ======================
DASHBOARD
====================== */

async function showDashboard(){

const res = await fetch(API+"/admin/orders",{
headers:{Authorization:"Bearer "+token}
})

const data = await res.json()

const orders = data.orders

const total = orders.length

const paid =
orders.filter(o=>o.status=="paid").length

const pending =
orders.filter(o=>o.status=="pending").length

document.getElementById("content").innerHTML=`

<h3>Dashboard</h3>

<div class="row">

<div class="col-md-4">
<div class="card-box">
<h5>Total Orders</h5>
<h3>${total}</h3>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<h5>Paid Orders</h5>
<h3>${paid}</h3>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<h5>Pending Orders</h5>
<h3>${pending}</h3>
</div>
</div>

</div>

`

}



/* ======================
ORDERS
====================== */

async function showOrders(){

const res = await fetch(API+"/admin/orders",{
headers:{Authorization:"Bearer "+token}
})

const data = await res.json()
const orders = data.orders

let html = `
<h3>Orders</h3>

<div class="card-box">
<table class="table">

<tr>
<th>ID</th>
<th>User</th>
<th>Total</th>
<th>Status</th>
<th>Payment</th>
<th>Update</th>
</tr>
`

orders.forEach(o=>{

html+=`

<tr>

<td>${o.id}</td>
<td>${o.user_id}</td>
<td>₹${o.total}</td>

<td>
<select id="status-${o.id}" class="form-select">

<option ${o.status=="pending"?"selected":""}>pending</option>
<option ${o.status=="paid"?"selected":""}>paid</option>
<option ${o.status=="delivered"?"selected":""}>delivered</option>

</select>
</td>

<td>${o.payment_status}</td>

<td>
<button
class="btn btn-sm btn-dark"
onclick="updateStatus(${o.id})">
Update
</button>
</td>

</tr>

`

})

html += "</table></div>"

document.getElementById("content").innerHTML = html

}



async function updateStatus(id){

const status =
document.getElementById("status-"+id).value

await fetch(
API+"/admin/update/"+id+"/"+status,
{
method:"PATCH",
headers:{Authorization:"Bearer "+token}
}
)

showOrders()

}



/* ======================
PRODUCTS LIST
====================== */

async function showProducts(){

const res = await fetch(API+"/admin/products",{
headers:{Authorization:"Bearer "+token}
})

const products = await res.json()

let html=`

<h3>Products</h3>

<div class="card-box">

<table class="table">

<tr>
<th>ID</th>
<th>Name</th>
<th>Price</th>
<th>Stock</th>
<th>Delete</th>
</tr>
`

products.forEach(p=>{

html+=`

<tr>

<td>${p.id}</td>
<td>${p.name}</td>
<td>${p.price}</td>
<td>${p.stock}</td>

<td>
<button
class="btn btn-sm btn-danger"
onclick="deleteProduct(${p.id})">
Delete
</button>
</td>

</tr>

`

})

html+="</table></div>"

document.getElementById("content").innerHTML = html

}



async function deleteProduct(id){

await fetch(
API+"/admin/products?id="+id,
{
method:"DELETE",
headers:{Authorization:"Bearer "+token}
}
)

showProducts()

}



/* ======================
ADD PRODUCT
====================== */

function showAdd(){

document.getElementById("content").innerHTML=`

<h3>Add Product</h3>

<div class="card-box">

<input id="name" class="form-control mb-2" placeholder="Name">
<input id="price" class="form-control mb-2" placeholder="Price">
<input id="stock" class="form-control mb-2" placeholder="Stock">
<input id="category" class="form-control mb-2" placeholder="Category">

<button
class="btn btn-dark"
onclick="addProduct()">

Create

</button>

</div>

`

}



async function addProduct(){

const name = document.getElementById("name").value
const price = document.getElementById("price").value
const stock = document.getElementById("stock").value
const category = document.getElementById("category").value

await fetch(
API+"/admin/products",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
name,
price:Number(price),
stock:Number(stock),
category
})
}
)

showProducts()

}



function logout(){
localStorage.removeItem("token")
location.href="index.html"
}

</script>

</body>

</html>
