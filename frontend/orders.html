<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>My Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f9f5f0;
font-family:'Cormorant Garamond',serif;
}

.navbar{
background:#8b6f47;
}

.logo{
font-family:'Playfair Display',serif;
font-size:2rem;
color:white;
}

.card-order{
border:2px solid #d4c2a8;
border-radius:10px;
padding:15px;
margin-bottom:15px;
background:white;
}

.btn-vintage{
background:#8b6f47;
color:white;
border-radius:30px;
}

</style>

</head>

<body>


<script>

const API="http://localhost:8080"

async function verifyUser(){

const token=localStorage.getItem("token")

if(!token){
logout()
return
}

try{

const res=await fetch(
API+"/me/profile",
{
headers:{
Authorization:"Bearer "+token
}
})

if(!res.ok){
logout()
}

}catch(e){
logout()
}

}

function logout(){
localStorage.removeItem("token")
window.location.href="index.html"
}

verifyUser()

</script>



<nav class="navbar navbar-dark px-4">

<span class="logo">Vintage 1950</span>

<div>

<a href="products.html" class="btn btn-outline-light">Shop</a>

<a href="cart.html" class="btn btn-outline-light">Cart</a>

</div>

</nav>



<div class="container mt-5">

<h2>My Orders</h2>

<div id="ordersList"></div>

</div>



<script>

const token = localStorage.getItem("token")

async function loadOrders(){

try{

const res = await fetch(API+"/orders/",{
headers:{
Authorization:"Bearer "+token
}
})

if(!res.ok){
logout()
return
}

const data = await res.json()

const orders = data.orders || []

const container = document.getElementById("ordersList")

container.innerHTML=""

orders.forEach(o=>{

const id = o.ID || o.id
const status = o.Status || o.status
const total = o.Total || o.total

container.innerHTML += `

<div class="card-order">

<h5>Order #${id}</h5>

<p>Status: ${status}</p>

<p>Total: ₹${total}</p>

<button
class="btn btn-vintage"
onclick="viewOrder(${id})">

View Details

</button>

</div>

`

})

}catch(e){

logout()

}

}



function viewOrder(id){

window.location.href="order_details.html?id="+id

}



loadOrders()

</script>


</body>
</html>
