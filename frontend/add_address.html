<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Add Address</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
background: #f9f5f0;
font-family: 'Cormorant Garamond', serif;
}

.navbar {
background: #8b6f47;
}

.box {
max-width: 500px;
margin: auto;
margin-top: 50px;
background: white;
padding: 20px;
border-radius: 10px;
}

</style>

</head>

<body>


<script>

const API=""

async function verifyUser(){

const token=localStorage.getItem("token")

if(!token){
logout()
return
}

try{

const res=await fetch(
API+"/me/profile",
{
headers:{
Authorization:"Bearer "+token
}
})

if(!res.ok){
logout()
}

}catch(e){
logout()
}

}

function logout(){
localStorage.removeItem("token")
location.href="index.html"
}

verifyUser()

</script>



<nav class="navbar navbar-dark px-4">

<a href="/frontend/index.html"
class="navbar-brand">

Vintage 1950

</a>

<div>

<a href="/frontend/index.html"
class="btn btn-outline-light me-2">

Home

</a>

<a href="/frontend/cart.html"
class="btn btn-outline-light">

Cart

</a>

</div>

</nav>



<div class="box">

<div id="msgBox"></div>

<h3>Add Address</h3>

<input
id="address1"
class="form-control mb-2"
placeholder="Address">

<input
id="city"
class="form-control mb-2"
placeholder="City">

<input
id="state"
class="form-control mb-2"
placeholder="State">

<input
id="pincode"
class="form-control mb-2"
placeholder="Pincode">

<button
class="btn btn-success"
onclick="addAddress()">

Save

</button>

</div>



<script>

const token =
localStorage.getItem("token")



function showError(msg){

const box =
document.getElementById("msgBox")

box.innerHTML=`

<div class="alert alert-danger">

${msg}

</div>

`

}



function showSuccess(msg){

const box =
document.getElementById("msgBox")

box.innerHTML=`

<div class="alert alert-success">

✔ ${msg}

</div>

`

}



async function addAddress(){

const address1 =
document.getElementById("address1").value.trim()

const city =
document.getElementById("city").value.trim()

const state =
document.getElementById("state").value.trim()

const pincode =
document.getElementById("pincode").value.trim()


if(!address1||!city||!state||!pincode){

showError("All fields required")
return

}

if(pincode.length<4){

showError("Invalid pincode")
return

}


try{

const res =
await fetch(
API+"/addresses/add",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
address1,
city,
state,
pincode
})
}
)

if(!res.ok){
logout()
return
}

showSuccess("Address added")

setTimeout(()=>{

location.href="profile.html"

},1000)

}catch(e){

logout()

}

}

</script>


</body>
</html>
