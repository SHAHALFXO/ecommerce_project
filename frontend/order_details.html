<!DOCTYPE html>
<html>

<head>

<title>Order Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f9f5f0;
font-family:'Cormorant Garamond',serif;
}

.box{
max-width:900px;
margin:auto;
margin-top:30px;
background:white;
padding:20px;
border-radius:10px;
}

.item{
border-bottom:1px solid #ddd;
padding:10px 0;
}

</style>

</head>

<body>


<div class="container mt-3">

<button
class="btn btn-outline-dark"
onclick="history.back()">

← Back

</button>

</div>



<div class="box">

<h3>Order Details</h3>

<div id="orderBox">

Loading...

</div>

</div>



<script>

const API = ""

const token = localStorage.getItem("token")

if(!token){
location.href="index.html"
}


const params =
new URLSearchParams(window.location.search)

const orderID =
params.get("id")



async function loadOrder(){

try{

const res =
await fetch(
API + "/orders/details/" + orderID,
{
headers:{
Authorization:"Bearer "+token
}
}
)

const data =
await res.json()

console.log(data)

const order =
data.order

const box =
document.getElementById("orderBox")

if(!order){
box.innerHTML = "Order not found"
return
}

box.innerHTML = `

<p><b>Order ID:</b> ${order.ID || order.id}</p>

<p><b>Status:</b> ${order.Status || order.status}</p>

<p><b>Total:</b> ₹${order.Total || order.total}</p>

<h5>Items</h5>

<div id="items"></div>

`


const itemsBox =
document.getElementById("items")

// ✅ SAFE ITEMS HANDLING
const items =
order.OrderItems ||
order.order_items ||
order.items ||
[]

if(items.length === 0){

itemsBox.innerHTML = "No items found"

return

}


// ✅ RENDER ITEMS
items.forEach(i=>{

itemsBox.innerHTML += `

<div class="item">

Product ID: ${i.ProductID || i.product_id}

<br>

Qty: ${i.Quantity || i.quantity}

<br>

Price: ₹${i.Price || i.price}

</div>

`

})

}catch(e){

document.getElementById("orderBox").innerHTML =
"Error loading order"

}

}


loadOrder()

</script>

</body>

</html>
